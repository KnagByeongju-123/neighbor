<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F7EF">
<title>이웃사촌</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>">
<style>
:root{
  /* 색상 테마: 인트로 일러스트(연둣빛 잔디 · 크림 하늘 · 흙갈색 · 장미 레드)에서 추출 */
  --bg:#F8F7EF; --card:#FFFFFF; --line:#E5E4D2;
  --ink:#3A352C; --ink-soft:#8E8975;
  --accent:#7C9A4E; --accent-soft:#EEF2DE; --accent-deep:#5F7C39;
  --sky:#EDE9C8; --earth:#A58472; --earth-soft:#F1E7DF;
  --green:#6B9350; --red:#C4453F;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
  padding-bottom:calc(28px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}

/* 헤더 */
header{padding:18px 18px 8px;display:flex;align-items:center;justify-content:space-between;max-width:640px;margin:0 auto}
header h1{font-size:21px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:flex-end;gap:7px}
header h1 .logo-sm{height:38px;width:auto;display:block;
  filter:drop-shadow(0 1px 2px rgba(58,53,44,.15))}
@media(max-width:400px){ header h1 .logo-sm{height:33px} }
header h1 small{font-size:12px;font-weight:600;color:var(--earth);margin:0 0 5px 0}
.login-btn{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--ink)}
.login-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}

main{max-width:640px;margin:0 auto;padding:4px 16px 24px}
.page{display:none}
.page.on{display:block}
h2{font-size:17px;font-weight:800;margin:14px 0 10px;letter-spacing:-.3px}
.page-head{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px}
.page-head h2{margin:0}

/* 카드/버튼 */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.btn{border:none;border-radius:10px;padding:9px 15px;font-size:14px;font-weight:700}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn-sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn-danger{background:transparent;border:1px solid var(--line);color:var(--red)}

/* 통계 3열 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:12px;padding:13px 10px;text-align:center}
.stat .label{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-bottom:4px;white-space:nowrap}
.stat .value{font-size:17px;font-weight:800;letter-spacing:-.4px}
.stat .value small{font-size:11px;font-weight:600;color:var(--ink-soft)}

/* 리스트 아이템 */
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .t{font-weight:700;font-size:14.5px}
.item .s{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.amt-in{color:var(--green);font-weight:800}
.amt-out{color:var(--red);font-weight:800}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent-deep);margin-right:6px;vertical-align:1px}
.badge.gray{background:var(--earth-soft);color:var(--earth)}

/* 납부 그리드 */
.dues-wrap{overflow-x:auto}
.dues{border-collapse:collapse;width:100%;min-width:520px}
.dues th,.dues td{border:1px solid var(--line);padding:6px 4px;font-size:12px;text-align:center}
.dues th{background:#F4F3E4;font-weight:700;color:var(--ink-soft)}
.dues td:first-child,.dues th:first-child{position:sticky;left:0;background:var(--card);font-weight:700;min-width:64px;z-index:1}
.dues th:first-child{background:#F4F3E4}
.dues .ok{color:var(--green);font-weight:800}
.year-sel{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:nowrap}
.year-sel b{font-size:14.5px;font-weight:800;white-space:nowrap}
.year-sel .yr{display:flex;align-items:center;gap:4px;flex-shrink:0}
.year-sel button{border:1px solid var(--line);background:var(--card);border-radius:8px;
  width:28px;height:28px;font-size:15px;line-height:1;color:var(--ink);flex-shrink:0}
.year-sel em{font-style:normal;font-size:14.5px;font-weight:800;min-width:52px;text-align:center;white-space:nowrap}

/* 상단 탭 — 빨랫줄에 걸린 메모지 (가로 스크롤) */
.nav-wrap{position:sticky;top:0;z-index:60;background:var(--bg);padding:2px 0 8px;
  box-shadow:0 8px 12px -10px rgba(58,53,44,.35)}
nav{width:100%;max-width:640px;margin:0 auto;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
.rope{position:relative;display:inline-flex;flex-wrap:nowrap;gap:11px;
  min-width:100%;padding:20px 18px 12px;box-sizing:border-box;justify-content:center}
/* 빨랫줄 (살짝 처진 곡선) */
.rope::before{content:'';position:absolute;left:0;right:0;top:8px;height:13px;
  border-bottom:2px solid #C2AE93;border-radius:0 0 50% 50% / 0 0 13px 13px;pointer-events:none}
/* 메모지 */
nav button{position:relative;flex:0 0 auto;margin-top:9px;
  background:linear-gradient(180deg,#FFFDF4 0%,#FBF7E7 100%);
  border:1px solid #E3DCC4;border-radius:3px;
  color:#6B6455;font:inherit;font-size:14px;font-weight:700;letter-spacing:-.3px;
  padding:10px 15px 11px;white-space:nowrap;transform-origin:50% -4px;
  box-shadow:1px 3px 6px rgba(58,53,44,.14);
  transition:transform .2s ease, box-shadow .2s ease, background .2s, color .2s, border-color .2s}
/* 빨래집게 */
nav button::before{content:'';position:absolute;top:-9px;left:50%;margin-left:-5px;
  width:10px;height:17px;border-radius:2px 2px 3px 3px;
  background:linear-gradient(180deg,#C89A63 0%,#A87B4A 55%,#8E6538 100%);
  box-shadow:0 1px 2px rgba(58,53,44,.3);pointer-events:none}
nav button::after{content:'';position:absolute;top:-3px;left:50%;margin-left:-6px;
  width:12px;height:2px;border-radius:2px;background:rgba(255,255,255,.55);pointer-events:none}
/* 기울기 (자연스럽게) */
nav button:nth-child(1){transform:rotate(-2.4deg)}
nav button:nth-child(2){transform:rotate(1.8deg)}
nav button:nth-child(3){transform:rotate(-1.4deg)}
nav button:nth-child(4){transform:rotate(2.2deg)}
nav button:nth-child(5){transform:rotate(-1.9deg)}
nav button:nth-child(6){transform:rotate(1.5deg)}
/* 선택된 메모지 — 똑바로 서면서 올라옴 */
nav button.on{transform:rotate(0deg) translateY(-3px) !important;
  background:linear-gradient(180deg,#F3F7E4 0%,#E7EFD2 100%);
  border-color:var(--accent);color:var(--accent-deep);
  box-shadow:0 5px 12px rgba(124,154,78,.3)}
nav button.on::before{background:linear-gradient(180deg,#8FAE5E 0%,#6F8F44 55%,#5A7736 100%)}
nav button:hover:not(.on){box-shadow:1px 4px 9px rgba(58,53,44,.2)}
@media(max-width:420px){
  .rope{gap:8px;padding:20px 12px 12px}
  nav button{padding:9px 11px 10px;font-size:13px}
}
@media(prefers-reduced-motion:reduce){ nav button{transition:none} }

/* 모달 */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(30,28,24,.45);z-index:100;align-items:flex-end;justify-content:center}
.modal-bg.on{display:flex}
.modal{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;
  padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto}
.modal h3{font-size:16.5px;font-weight:800;margin-bottom:14px}
.field{margin-bottom:11px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;background:#FCFCF5;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-btns{display:flex;gap:8px;margin-top:16px}
.modal-btns .btn{flex:1;padding:12px}

/* 토스트 */
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);
  background:#3A352C;color:#fff;padding:9px 18px;border-radius:22px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:.25s;z-index:200;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#loading{display:none;position:fixed;inset:0;z-index:150;align-items:center;justify-content:center;background:rgba(247,245,240,.5)}
#loading.on{display:flex}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--ink-soft);font-size:13.5px;padding:26px 0}
/* 인트로 */
#intro{position:fixed;inset:0;z-index:500;background:linear-gradient(180deg,#FCFBF2 0%,#EDE9C8 55%,#E3EBCF 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 22px calc(30px + env(safe-area-inset-bottom));
  transition:opacity .45s ease, visibility .45s}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}
#intro .globe{width:min(64vw,270px);aspect-ratio:1/1;border-radius:50%;object-fit:cover;
  animation:floaty 5s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
#intro .logo-cal{width:min(58vw,240px);height:auto;margin-top:12px;display:block;
  filter:drop-shadow(0 3px 6px rgba(58,53,44,.18))}
#intro .sub{font-size:13.5px;color:var(--ink-soft);margin-top:4px;font-weight:600}
#intro .pinbox{width:100%;max-width:290px;margin-top:26px}
#intro .pinbox input{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;
  padding:14px 16px;font-size:18px;text-align:center;letter-spacing:6px;outline:none;font-weight:700}
#intro .pinbox input:focus{border-color:var(--accent)}
#intro .pinbox input::placeholder{letter-spacing:0;font-weight:600;font-size:15px;color:#BDB7AA}
#intro .pinbox .btn{width:100%;margin-top:9px;padding:13px;border-radius:14px;font-size:15px}
#intro .skip{margin-top:14px;background:none;border:none;font-size:13px;color:var(--ink-soft);
  font-weight:600;text-decoration:underline;text-underline-offset:3px}
#intro .err{font-size:12.5px;color:var(--red);font-weight:700;min-height:17px;margin-top:8px;text-align:center}
.admin-only{display:none}
body.admin .admin-only{display:inline-block}
.auth-only{display:none}
body.auth .auth-only{display:inline-block}
.notice-box{background:var(--accent-soft);border:1px solid #D8E2BE;border-radius:12px;padding:12px 14px;margin-bottom:12px}
.notice-box .t{font-weight:800;font-size:14px;color:var(--accent-deep)}
.notice-box .s{font-size:13px;margin-top:3px;white-space:pre-wrap}
.photo-preview{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.photo-preview img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.post-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-top:10px}
.post-photos .ph{position:relative}
.post-photos img{width:100%;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:#EFEEDD}
.post-photos .rm{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:none;
  background:rgba(30,28,24,.65);color:#fff;font-size:11px;line-height:20px;padding:0}
#photoView{display:none;position:fixed;inset:0;background:rgba(20,18,15,.94);z-index:300;
  align-items:center;justify-content:center;padding:64px 10px 24px}
#photoView.on{display:flex}
#photoView img{max-width:96vw;max-height:100%;border-radius:8px;object-fit:contain}
#photoClose{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:310;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;
  font:inherit;font-size:14px;font-weight:700;padding:9px 16px;border-radius:22px;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#photoClose:active{background:rgba(255,255,255,.3)}
/* 다이얼(휠) 시간 선택 */
.wheel{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;
  background:#FCFCF5;border:1px solid var(--line);border-radius:12px;overflow:hidden;height:150px}
.wheel-band{position:absolute;left:6px;right:6px;top:50%;height:42px;margin-top:-21px;
  background:var(--accent-soft);border-top:1.5px solid var(--accent);border-bottom:1.5px solid var(--accent);
  border-radius:8px;pointer-events:none;z-index:1}
.wheel-col{position:relative;z-index:2;height:150px;overflow-y:auto;scroll-snap-type:y mandatory;
  scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;
  padding:54px 0;text-align:center}
.wheel-col::-webkit-scrollbar{display:none}
.wheel-col div{height:42px;line-height:42px;scroll-snap-align:center;font-size:18px;font-weight:700;
  color:#B8B2A2;transition:color .15s, transform .15s;cursor:pointer}
.wheel-col div.sel{color:var(--accent-deep);font-size:20px;font-weight:800}
.wheel-view{margin-top:7px;text-align:center;font-size:13px;font-weight:700;color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--accent-soft);border:1px solid #D8E2BE;color:var(--accent-deep);
  font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:16px;white-space:nowrap}
.chips button:active{background:var(--accent);color:#fff}
.chips .none{font-size:12px;color:var(--ink-soft);padding:3px 0}
.hint{font-size:12px;color:var(--earth);background:var(--earth-soft);border-radius:8px;
  padding:7px 10px;margin-top:7px;line-height:1.45}
.hint b{color:var(--accent-deep)}
.info-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.info-wrap::-webkit-scrollbar{height:6px}
.info-wrap::-webkit-scrollbar-thumb{background:#DAD5C2;border-radius:3px}
.info-tbl{border-collapse:collapse;width:max-content;min-width:100%}
.info-tbl th,.info-tbl td{border:1px solid var(--line);padding:8px 10px;font-size:12.5px;
  text-align:left;vertical-align:middle;white-space:nowrap}
.info-tbl th{background:#F4F3E4;font-weight:700;color:var(--ink-soft);text-align:center}
.info-tbl td.c{text-align:center}
.info-tbl td:first-child,.info-tbl th:first-child{position:sticky;left:0;z-index:1;
  background:var(--card);font-weight:700;box-shadow:1px 0 0 var(--line)}
.info-tbl th:first-child{background:#F4F3E4;z-index:2}
.info-tbl .btn-sm{padding:3px 9px;font-size:11.5px}
@media(max-width:400px){ .info-tbl th,.info-tbl td{font-size:12px;padding:7px 8px} }
</style>
</head>

<main>
  <!-- 홈 -->
  <section class="page on" id="pg-home">
    <div class="stats">
      <div class="stat"><div class="label">총 수입</div><div class="value" id="hIn" style="color:var(--green)">-</div></div>
      <div class="stat"><div class="label">총 지출</div><div class="value" id="hOut" style="color:var(--red)">-</div></div>
      <div class="stat"><div class="label">잔액</div><div class="value" id="hBal">-</div></div>
    </div>
    <div id="hNotice"></div>
    <h2>다가오는 모임</h2>
    <div class="card" id="hEvents"></div>
    <h2>최근 소식</h2>
    <div class="card" id="hPosts"></div>
  </section>

  <!-- 회비 -->
  <section class="page" id="pg-fee">
    <div class="page-head"><h2>회비</h2>
      <button class="btn btn-primary btn-sm admin-only" onclick="openFee()">＋ 내역 등록</button></div>
    <div class="stats">
      <div class="stat"><div class="label">총 수입</div><div class="value" id="fIn" style="color:var(--green)">-</div></div>
      <div class="stat"><div class="label">총 지출</div><div class="value" id="fOut" style="color:var(--red)">-</div></div>
      <div class="stat"><div class="label">잔액</div><div class="value" id="fBal">-</div></div>
    </div>

      <div class="year-sel">

          <button onclick="chgYear(-1)">‹</button><em id="duesYear"></em><button onclick="chgYear(1)">›</button>
        </span>
      </div>
      <div class="dues-wrap"><table class="dues" id="duesTbl"></table></div>
    </div>
    <div class="card" id="feeList"></div>
  </section>

  <!-- 모임 -->
  <section class="page" id="pg-event">
    <div class="page-head"><h2>모임</h2>
      <button class="btn btn-primary btn-sm auth-only" onclick="openEvent()">＋ 모임 등록</button></div>
    <div class="card" id="eventList"></div>
  </section>

  </section>

<div class="modal-bg" id="mLogin"><div class="modal">

  <div class="modal-btns">
    <button class="btn btn-ghost" onclick="closeM('mLogin')">취소</button>
    <button class="btn btn-primary" onclick="doLogin()">로그인</button>
  </div>
</div></div>

<!-- 회비 모달 -->
<div class="modal-bg" id="mFee"><div class="modal">
  <h3 id="feeTitle">회비 내역 등록</h3>
  <input type="hidden" id="feeId">
  <div class="row2">
    <div class="field"><label>날짜</label><input id="feeDate" type="date"></div>
    <div class="field"><label>구분</label><select id="feeKind"><option>수입</option><option>지출</option></select></div>
  </div>
  <div class="field"><label>내용</label>
    <input id="feeDetail" placeholder="예: 8월 회비" list="feeDetailList" autocomplete="off">

    <div class="hint" id="feeDetailHint">💡 월회비는 <b>“○월 회비”</b> 형식으로 입력해야 납부 현황에 표시됩니다.</div>
    <div class="chips" id="feeDetailChips"></div>
  </div>
  <div class="row2">
    <div class="field"><label>금액</label><input id="feeAmt" type="number" inputmode="numeric" placeholder="0"></div>
    <div class="field"><label>회원명 (월회비인 경우)</label><select id="feeMember"><option value="">-</option></select></div>
  </div>
  <div class="modal-btns">
    <button class="btn btn-ghost" onclick="closeM('mFee')">취소</button>
    <button class="btn btn-primary" onclick="saveFee()">저장</button>
  </div>
</div></div>

<!-- 모임 모달 -->
<div class="modal-bg" id="mEvent"><div class="modal">
  <h3 id="evTitle">모임 등록</h3>
  <input type="hidden" id="evId">

    <div class="field"><label>날짜</label><input id="evDate" type="date"></div>

      <input id="evTime" type="hidden">

        <div class="wheel-col" id="wAmpm"></div>
        <div class="wheel-col" id="wHour"></div>
        <div class="wheel-col" id="wMin"></div>

/* 다이얼 시간 선택 */
const W_AMPM = ['오전','오후'];
const W_HOUR = Array.from({length:12},(_,i)=>String(i+1));
const W_MIN  = Array.from({length:12},(_,i)=>String(i*5).padStart(2,'0'));
const WHEEL_H = 42;
let wheelReady = false;

function buildWheel(colId, items){
  $(colId).innerHTML = items.map((v,i)=>'<div data-i="'+i+'">'+v+'</div>').join('');
  $(colId).querySelectorAll('div').forEach(el=>{
    el.addEventListener('click', ()=>{ setWheelIdx(colId, +el.dataset.i, true); });
  });
}
function getWheelIdx(colId){
  const c = $(colId);
  return Math.max(0, Math.round(c.scrollTop / WHEEL_H));
}
function setWheelIdx(colId, idx, smooth){
  const c = $(colId);
  c.scrollTo({ top: idx*WHEEL_H, behavior: smooth?'smooth':'auto' });
  markWheel(colId, idx);
}
function markWheel(colId, idx){
  $(colId).querySelectorAll('div').forEach((el,i)=>el.classList.toggle('sel', i===idx));
}
function syncTime(){
  const ai = getWheelIdx('wAmpm'), hi = getWheelIdx('wHour'), mi = getWheelIdx('wMin');
  markWheel('wAmpm',ai); markWheel('wHour',hi); markWheel('wMin',mi);
  let h = hi + 1;
  if(ai===1 && h!==12) h += 12;
  if(ai===0 && h===12) h = 0;
  const val = String(h).padStart(2,'0')+':'+W_MIN[mi];
  $('evTime').value = val;
  $('timeView').textContent = W_AMPM[ai]+' '+W_HOUR[hi]+'시 '+W_MIN[mi]+'분';
}
function initWheel(){
  if(wheelReady) return;
  buildWheel('wAmpm', W_AMPM); buildWheel('wHour', W_HOUR); buildWheel('wMin', W_MIN);
  ['wAmpm','wHour','wMin'].forEach(id=>{
    let t;
    $(id).addEventListener('scroll', ()=>{ clearTimeout(t); t = setTimeout(syncTime, 90); });
  });
  wheelReady = true;
}
function setWheelTime(v){
  initWheel();
  let h = 19, m = 0;
  const mt = String(v||'').match(/^(\d{1,2}):(\d{2})/);
  if(mt){ h = +mt[1]; m = +mt[2]; }
  const ai = h >= 12 ? 1 : 0;
  let h12 = h % 12; if(h12===0) h12 = 12;
  const mi = Math.min(11, Math.round(m/5));
  setWheelIdx('wAmpm', ai); setWheelIdx('wHour', h12-1); setWheelIdx('wMin', mi);
  setTimeout(syncTime, 60);
}

/* 이미지 압축 (50KB 이하 JPEG) */
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const rd = new FileReader();
    rd.onerror = ()=>reject(new Error('파일 읽기 실패'));
    rd.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('이미지 로드 실패'));
      img.onload = ()=>{
        const MAX = 50*1024;
        let w = img.width, h = img.height;
        let scale = Math.min(1, 1000/Math.max(w,h));
        const cv = document.createElement('canvas');
        const draw = sc=>{
          cv.width = Math.max(1, Math.round(w*sc));
          cv.height = Math.max(1, Math.round(h*sc));
          const ctx = cv.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cv.width,cv.height);
          ctx.drawImage(img,0,0,cv.width,cv.height);
        };
        let q = 0.8, out = '';
        for(let i=0;i<12;i++){
          draw(scale);
          out = cv.toDataURL('image/jpeg', q);
          const bytes = Math.ceil((out.length - out.indexOf(',') - 1) * 3/4);
          if(bytes <= MAX) break;
          if(q > 0.45) q -= 0.12; else scale *= 0.82;
        }
        resolve(out);
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}
async function uploadPhotos(postId, files){
  for(const f of files){
    const b64 = await compressImage(f);
    const up = await supaFetch('uploadImage',{kind:'post', base64:b64});
    if(up.error) throw new Error(up.error);
    const ad = await supaFetch('addPhoto',{postId:postId, fileId:String(up.data.id)});
    if(ad.error) throw new Error(ad.error);
    DATA.posts = ad.data;
    IMG_CACHE[String(up.data.id)] = b64;
  }
}

/* 게시판 */
const IMG_CACHE = {};
function openPost(id){
  const p = id ? DATA.posts.find(x=>x['ID']===id) : null;
  $('poTitle').textContent=p?'글 수정':'글쓰기';
  $('poId').value=p?p['ID']:''; $('poKind').value=p?p['종류']:'일반';
  $('poTtl').value=p?p['제목']:''; $('poContent').value=p?p['내용']:'';
  $('poFiles').value=''; $('poPreview').innerHTML='';
  openM('mPost');
}
$('poFiles').addEventListener('change', ()=>{
  const pv=$('poPreview'); pv.innerHTML='';
  Array.from($('poFiles').files).forEach(f=>{
    const u=URL.createObjectURL(f);
    const im=document.createElement('img'); im.src=u; pv.appendChild(im);
  });
});
function savePost(){
  if(!$('poTtl').value.trim()){ alert('제목을 입력해 주세요.'); return; }
  const files = Array.from($('poFiles').files);
  loading(true);
  supaFetch('savePost',{ID:$('poId').value,'종류':$('poKind').value,'제목':$('poTtl').value.trim(),'내용':$('poContent').value})
    .then(async res=>{
      if(res.error){ loading(false); alert('오류: '+res.error); return; }
      DATA.posts = res.data.posts;
      const postId = res.data.ID;
      if(files.length){
        try{ await uploadPhotos(postId, files); }
        catch(e){ alert('사진 업로드 오류: '+e.message); }
      }
      loading(false);
      closeM('mPost'); renderPosts(); renderHome(); toast('저장되었습니다');
    })
    .catch(e=>{ loading(false); alert('연결 오류: '+e.message); });
}
function loadPhoto(fid, el){
  if(IMG_CACHE[fid]){ el.src = IMG_CACHE[fid]; return; }
  supaFetch('getImage',{id:fid}).then(res=>{
    if(res.data){ IMG_CACHE[fid]=res.data; el.src=res.data; }
  });
}
let photoOpen = false;
function viewPhoto(fid){
  const v=$('photoView'), im=$('photoViewImg');
  im.src = IMG_CACHE[fid]||'';
  v.classList.add('on');
  document.body.style.overflow='hidden';
  if(!photoOpen){
    photoOpen = true;
    history.pushState({photo:true}, '');
  }
}
function closePhoto(){
  if(!photoOpen){ $('photoView').classList.remove('on'); return; }
  history.back();   // popstate 에서 실제로 닫힘
}
function hidePhoto(){
  photoOpen = false;
  $('photoView').classList.remove('on');
  $('photoViewImg').src='';
  document.body.style.overflow='';
}
window.addEventListener('popstate', ()=>{
  if(photoOpen) hidePhoto();
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && photoOpen) closePhoto();
});
function removePhoto(postId, fid){
  if(!confirm('이 사진을 삭제할까요?'))return;
  call('removePhoto',{postId:postId, fileId:String(fid)},d=>{

}
